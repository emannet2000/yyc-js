services:
  - type: web
    name: yyc-brokers
    runtime: docker
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: RENDER
        value: "true"
      - key: DATABASE_PATH
        value: /data/yyc.sqlite
    disk:
      name: yyc-data
      mountPath: /data
      sizeGB: 1
